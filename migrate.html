<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<title>迁移闻刊记录</title>
<style>
html,body{margin:0;height:100%;background:#0c0c0f;color:#eee9e0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.box{max-width:420px;width:100%;border:1px solid rgba(231,183,106,.25);border-radius:18px;padding:26px 22px;background:linear-gradient(160deg,#17171e,#101116);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.k{font-size:9px;letter-spacing:.26em;color:rgba(231,183,106,.7);margin-bottom:12px}
h1{font-size:22px;margin:0 0 12px;font-weight:600;color:#f1e7d3}
p{font-size:13.5px;line-height:1.8;color:rgba(238,233,224,.7);margin:0 0 16px}
a{display:inline-block;color:#e7b76a;text-decoration:none;font-size:13px;border:1px solid rgba(231,183,106,.35);border-radius:10px;padding:9px 14px}
</style>
</head>
<body>
<div class="box">
  <div class="k">WENKAN · MIGRATE</div>
  <h1>迁移旧闻刊记录</h1>
  <p id="msg">正在读取这台设备上的旧闻刊记录…</p>
  <a id="back" href="https://4ktzkbxqau69p.doubao.link/app/app_17jed742mpf/index.html" style="display:none">返回新版闻刊</a>
</div>
<script>
(function () {
  var msg = document.getElementById('msg');
  var back = document.getElementById('back');
  var to = '';
  try { to = new URLSearchParams(location.search).get('to') || ''; } catch (e) { }
  function fail(text) {
    msg.textContent = text;
    if (to) back.href = to;
    back.style.display = 'inline-block';
  }
  if (!to) { fail('缺少迁移目标地址。请从新版闻刊的「设置 → 书库」里点「一键迁移」。'); return; }
  var target;
  try { target = new URL(to); } catch (e) { fail('迁移目标地址无效。'); return; }
  if (target.origin !== 'https://4ktzkbxqau69p.doubao.link' ||
      target.pathname.indexOf('/app/app_17jed742mpf/') !== 0) {
    fail('迁移目标不是合并版闻刊，已停止。'); return;
  }
  var raw = '';
  try { raw = localStorage.getItem('watchnext_state_v1') || ''; } catch (e) { }
  if (!raw) { fail('没有找到旧闻刊记录。可能这台设备还没用过旧版，或记录已被清理。'); return; }
  try {
    var st = JSON.parse(raw);
    if (!st || typeof st !== 'object' || !st.ratings) throw new Error('bad state');
  } catch (e) { fail('旧闻刊记录格式不对，无法迁移。请回旧版用「导出记录」备份。'); return; }
  try { window.name = 'WENKAN_STATE:' + raw; } catch (e) { fail('浏览器不允许携带迁移数据，请用旧版「导出记录」再手动导入。'); return; }
  msg.textContent = '已找到 ' + Object.keys(JSON.parse(raw).ratings || {}).length + ' 条观看记录，正在跳回新版闻刊…';
  setTimeout(function () { location.replace(to); }, 250);
})();
</script>
</body>
</html>
