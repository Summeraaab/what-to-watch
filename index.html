<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<meta name="description" content="按你的口味，从电影、剧集、番剧、综艺、小说、漫画和博主栏目里挑一部。每条推荐都说明为什么。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="闻刊">
<title>闻刊 · 影视推荐器</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/mobile.css">
<style>
#splash{position:fixed;inset:0;z-index:9999;background:#050506;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .55s ease;opacity:1}
#splash.hide{opacity:0;pointer-events:none}
#splash .sp-bg{position:absolute;inset:-40px;background:url('https://aka.doubaocdn.com/l/no8Pbi1icf') center/cover;filter:blur(48px) brightness(.28) saturate(.8);transform:scale(1.08);opacity:.45}
#splash .sp-vignette{position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 40%,transparent,rgba(5,5,6,.6) 68%,#050506 100%)}
#splash .sp-poster{position:relative;width:min(82vw,430px);max-height:69vh;object-fit:contain;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.8);opacity:0;transform:scale(.96) translateY(10px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1);z-index:1}
#splash .sp-poster.loaded{opacity:1;transform:none}
#splash .sp-copy{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));text-align:center;z-index:2}
#splash .sp-kicker{font-size:9px;letter-spacing:.28em;color:rgba(255,255,255,.45);text-transform:uppercase}
#splash .sp-brand{margin:8px 0 4px;font-family:'Noto Serif SC',serif;font-size:34px;color:#e7b76a;letter-spacing:.18em;text-indent:.18em}
#splash .sp-tag{font-size:10.5px;color:rgba(255,255,255,.4);letter-spacing:.18em}
#splash .sp-bar{position:absolute;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));width:54px;height:1px;background:rgba(255,255,255,.14);transform:translateX(-50%);overflow:hidden;z-index:2}
#splash .sp-bar i{display:block;width:100%;height:100%;background:#e7b76a;transform-origin:left;animation:spload 1.6s ease-in-out infinite}
@keyframes spload{0%{transform:scaleX(0)}60%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){#splash .sp-poster{transition:none}#splash .sp-bar{display:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-bg"></div>
  <div class="sp-vignette"></div>
  <img class="sp-poster" src="https://aka.doubaocdn.com/l/no8Pbi1icf" alt="" referrerpolicy="no-referrer">
  <div class="sp-bar"><i></i></div>
  <div class="sp-copy">
    <div class="sp-kicker">A PERSONAL SCREENING ROOM</div>
    <div class="sp-brand">闻刊</div>
    <div class="sp-tag">今晚，看点好的</div>
  </div>
</div>

<div id="app" class="shell"></div>
<div id="nav"></div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>
<div class="upbar hidden" id="upbar">
  <span>有新版本可使用</span>
  <button id="upbtn">立即更新</button>
</div>
<script src="./js/data-1.js"></script>
<script src="./js/data-2.js"></script>
<script src="./js/data-3.js"></script>
<script src="./js/data.js"></script>
<script src="./js/people-map.js"></script>
<script src="./js/store.js"></script>
<script src="./js/engine.js"></script>
<script src="./js/tmdb.js"></script>
<script src="./js/app.js"></script>
<script src="./js/views.js"></script>
<script src="./js/detail.js"></script>
<script src="./js/events.js"></script>
<script src="./js/v108.js"></script>
<script src="./js/library-link.js"></script>
<script src="./js/v110.js"></script>
<script src="./js/v111.js"></script>
<script>
(function () {
  var s = document.getElementById('splash');
  if (!s) return;
  var poster = s.querySelector('.sp-poster');
  var done = false;
  var maxTimer = setTimeout(hide, 2800);
  function hide() {
    if (done) return;
    done = true;
    clearTimeout(maxTimer);
    s.classList.add('hide');
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 700);
  }
  function ready() {
    if (poster) poster.classList.add('loaded');
    clearTimeout(maxTimer);
    setTimeout(hide, 1100);
  }
  if (poster) {
    poster.addEventListener('load', ready);
    poster.addEventListener('error', function () {
      poster.style.display = 'none';
      clearTimeout(maxTimer);
      setTimeout(hide, 700);
    });
    if (poster.complete && poster.naturalWidth) ready();
  } else {
    setTimeout(hide, 1200);
  }
})();
</script>
</body>
</html>
